server.port=${SERVER_PORT:8080}
spring.datasource.url=${TZME_DB_URL:jdbc:mysql://127.0.0.1:3306/tzme_corporate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TZME_DB_USER:tzme_app}
spring.datasource.password=${TZME_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${TZME_DDL_AUTO:validate}
spring.sql.init.mode=${TZME_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/01-schema.sql,classpath:db/04-contact.sql,classpath:db/05-social-links.sql,classpath:db/06-industry-icons.sql,classpath:db/07-home-capabilities.sql,classpath:db/08-analytics.sql,classpath:db/03-comments.sql
spring.sql.init.data-locations=classpath:db/02-data.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
tzme.upload-dir=${TZME_UPLOAD_DIR:./uploads}
