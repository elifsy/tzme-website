server.port=${SERVER_PORT:8080}
spring.datasource.url=${TZME_DB_URL:jdbc:mysql://127.0.0.1:3306/tzme_corporate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TZME_DB_USER:tzme_app}
spring.datasource.password=${TZME_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${TZME_DDL_AUTO:validate}
spring.sql.init.mode=${TZME_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/01-schema.sql,classpath:db/04-contact.sql,classpath:db/05-social-links.sql,classpath:db/06-industry-icons.sql,classpath:db/07-home-capabilities.sql,classpath:db/08-analytics.sql,classpath:db/09-about-tzme.sql,classpath:db/17-product-presentation-schema.sql,classpath:db/21-product-layout-schema.sql,classpath:db/25-admin-accounts.sql,classpath:db/03-comments.sql
spring.sql.init.data-locations=classpath:db/02-data.sql,classpath:db/10-j-design.sql,classpath:db/11-official-products.sql,classpath:db/12-home-solutions.sql,classpath:db/13-contact-facilities.sql,classpath:db/14-quality-positioning.sql,classpath:db/15-capability-process.sql,classpath:db/16-product-showcase.sql,classpath:db/18-product-presentation.sql,classpath:db/19-product-cutouts.sql,classpath:db/20-product-catalog-sync.sql,classpath:db/22-global-map-locations.sql,classpath:db/23-china-map-tianjin.sql,classpath:db/24-company-overview.sql,classpath:db/26-seo-settings.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
tzme.upload-dir=${TZME_UPLOAD_DIR:./uploads}
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${TZME_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.path=/
tzme.admin.username=${TZME_ADMIN_USERNAME:}
tzme.admin.password=${TZME_ADMIN_PASSWORD:}
tzme.admin.display-name=${TZME_ADMIN_DISPLAY_NAME:\u8d85\u7ea7\u7ba1\u7406\u5458}
tzme.admin.reset-password=${TZME_ADMIN_RESET_PASSWORD:false}
tzme.frontend-dir=${TZME_FRONTEND_DIR:../dist}
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=text/html,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,text/xml,image/svg+xml
