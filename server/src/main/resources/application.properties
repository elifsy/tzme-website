server.port=8080
spring.datasource.url=${TZME_DB_URL:jdbc:mysql://127.0.0.1:3306/tzme_corporate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TZME_DB_USER:tzme_app}
spring.datasource.password=${TZME_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jackson.default-property-inclusion=non_null
