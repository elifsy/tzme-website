user www-data;
worker_processes auto;
pid /run/tzme-nginx.pid;
error_log /var/log/tzme/nginx-error.log warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    access_log /var/log/tzme/nginx-access.log;
    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path /var/lib/nginx/proxy;
    gzip on;
    gzip_vary on;
    gzip_min_length 2048;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;
    include /etc/tzme/nginx-site.conf;
}
