# Activate after the certificate is installed and public access is arranged.
server {
    listen 80;
    server_name www.tzme.net tzme.net;
    return 301 https://www.tzme.net$request_uri;
}

server {
    listen 443 ssl;
    server_name www.tzme.net tzme.net;
    ssl_certificate /etc/tzme/certs/fullchain.pem;
    ssl_certificate_key /etc/tzme/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host = tzme.net) { return 301 https://www.tzme.net$request_uri; }
    include /etc/tzme/nginx-routes.conf;
}
