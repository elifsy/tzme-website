root /var/www/tzme;
charset utf-8;
client_max_body_size 101m;
client_body_timeout 120s;
proxy_read_timeout 120s;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

if ($request_uri = /index.html) { return 301 /; }
location ~ (^|/)\. { return 404; }
location ~ ^/(docs|database|server|scripts|src|node_modules|deploy)(/|$) { return 404; }
location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options nosniff;
}
location /api/ { proxy_pass http://127.0.0.1:8080; }
# Java renders real page HTML, discovery documents, redirects, and real 404s.
# Never replace this with an unconditional fallback to /index.html.
location / { proxy_pass http://127.0.0.1:8080; }
