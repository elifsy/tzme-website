# TZME 官网 Nginx 双环境配置
# 生产：www.tzme.net  → 静态 /var/www/tzme-prod + Java 127.0.0.1:8080
# 测试：test.tzme.net → 静态 /var/www/tzme-test + Java 127.0.0.1:8081
#
# 证书：默认使用 certbot 生成的路径。若改用华为云证书，
#      把两处 ssl_certificate / ssl_certificate_key 换成实际上传路径即可。
#
# 部署位置：/etc/nginx/sites-available/tzme
# 启用：ln -s /etc/nginx/sites-available/tzme /etc/nginx/sites-enabled/tzme
#      rm -f /etc/nginx/sites-enabled/default
#      nginx -t && systemctl reload nginx

# ---------------- 生产环境 ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tzme.net;

    ssl_certificate     /etc/letsencrypt/live/www.tzme.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.tzme.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/tzme-prod;
    index index.html;

    # GLB 模型最大 40MB，留出表单开销
    client_max_body_size 51m;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 2048;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    if ($request_uri = /index.html) { return 301 /; }

    location ~ ^/(docs|database|server|scripts|src|node_modules)(/|$) { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 首页由 Java 直出，供搜索引擎读取完整内容
    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri @public_html; }

    location @public_html {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------- 测试环境 ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.tzme.net;

    ssl_certificate     /etc/letsencrypt/live/www.tzme.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.tzme.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/tzme-test;
    index index.html;

    client_max_body_size 51m;
    charset utf-8;

    # 测试站与生产内容高度重复，必须阻止收录，避免影响正式站排名
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_vary on;
    gzip_min_length 2048;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    if ($request_uri = /index.html) { return 301 /; }

    location ~ ^/(docs|database|server|scripts|src|node_modules)(/|$) { return 404; }

    # 强制禁止抓取。不依赖 Java 生成的 robots.txt，
    # 因为测试库内容与生产相同，一旦放行就会产生重复索引。
    # 注意：本 location 有 add_header，父级的 add_header 不再继承，需重复声明。
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ~ ^/(sitemap\.xml|llms\.txt)$ {
        return 404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / { try_files $uri @public_html_test; }

    location @public_html_test {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}

# ---------------- HTTP 统一跳转 HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name tzme.net www.tzme.net test.tzme.net;

    # 证书签发（certbot webroot）需要保留 .well-known 可访问
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------- 裸域跳转到 www ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tzme.net;

    ssl_certificate     /etc/letsencrypt/live/www.tzme.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.tzme.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.tzme.net$request_uri;
}
