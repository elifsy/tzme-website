# Copy dist/ to /var/www/tzme; set TZME_FRONTEND_DIR=/var/www/tzme for Java.
# Terminate HTTPS at this server or the upstream gateway before public launch.
server {
    listen 80;
    server_name www.tzme.net;
    root /var/www/tzme;
    index index.html;
    client_max_body_size 51m;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 2048;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    if ($request_uri = /index.html) { return 301 /; }

    location ~ ^/(docs|database|server|scripts|src|node_modules)(/|$) { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / { try_files $uri @public_html; }

    location @public_html {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name tzme.net;
    return 301 https://www.tzme.net$request_uri;
}
